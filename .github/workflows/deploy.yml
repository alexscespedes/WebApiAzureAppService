name: CI/CD → Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "8.x"
  IMAGE_NAME: myapi

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # ── Job 2: Build & Push Docker image ─────────────────────────
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "image_tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "IMAGE_BASE=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Build & Push
        run: |
          docker build \
            -t $IMAGE_BASE:$SHORT_SHA \
            -t $IMAGE_BASE:latest \
            -f Dockerfile .

          docker push $IMAGE_BASE:$SHORT_SHA
          docker push $IMAGE_BASE:latest

  # ── Job 3: Deploy to App Service ─────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-push
    environment:
      name: production
      url: https://${{ vars.AZURE_APP_NAME }}.azurewebsites.net

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update container image
        run: |
          az webapp config container set \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG }} \
            --container-image-name \
              "${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.docker-push.outputs.image_tag }}"

      - name: Wait for deployment
        run: |
          echo "Waiting for App Service to pull new image..."
          sleep 45

      - name: Smoke test
        run: |
          URL="https://${{ vars.AZURE_APP_NAME }}.azurewebsites.net"

          echo "→ Health check"
          curl --fail --retry 5 --retry-delay 10 $URL/health

          echo "→ Users endpoint"
          RESPONSE=$(curl --fail --silent $URL/api/users)
          COUNT=$(echo $RESPONSE | jq '.count')

          echo "Users returned: $COUNT"
          [ "$COUNT" -ge 1 ] && echo "✓ Smoke test passed" || (echo "✗ No users returned" && exit 1)
