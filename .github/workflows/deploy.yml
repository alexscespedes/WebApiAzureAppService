name: Build, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore, Build & Test
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet test --no-build -c Release --verbosity normal

    deploy:
      needs: build-and-test
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      steps:
        - uses: actions/checkout@v4

        - name: Azure Login (OIDC — no stored secrets)
          uses: azure/login@v2
          with:
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

        - name: Login to ACR
          run: az acr login --name ${{ vars.ACR_NAME }}

        - name: Build & Push Docker image
          run: |
            IMAGE="${{ vars.ACR_NAME }}.azurecr.io/myapi:${{ github.sha }}"
            LATEST="${{ vars.ACR_NAME }}.azurecr.io/myapi:latest"

            docker build -t $IMAGE -t $LATEST .
            docker push $IMAGE
            docker push $LATEST

        - name: Deploy to App Service
          run: |
            az webapp config container set \
              --name ${{ vars.AZURE_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RG }} \
              --container-image-name "${{ vars.AZURE_APP_NAME }}.azurecr.io/myapi:${{ github.sha }}"

        - name: Verify deployment
          run: |
            sleep 30
            curl --fail https://${{ vars.AZURE_APP_NAME }}.azurewebsites.net/health
